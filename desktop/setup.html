<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Connect TaskDesk</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
:root{--bg:#F2F4F6;--ink:#18212E;--muted:#5D6776;--line:#DCE1E7;--accent:#1E8FE0;--err:#C02626;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#11161D;--ink:#E4E9F0;--muted:#98A2B2;--line:#2B3442;--accent:#5AB0F5;--err:#FF8A80;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",Ubuntu,system-ui,sans-serif}
.banner{display:block;width:100%;height:150px;object-fit:cover}
main{padding:22px 28px 28px}
h1{font-size:1.25rem;margin:0 0 6px}
p{margin:0 0 18px;color:var(--muted)}
label{display:block;font-weight:600;font-size:.875rem;margin-bottom:6px}
input{width:100%;box-sizing:border-box;font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink)}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
.err{color:var(--err);font-size:.875rem;min-height:1.4em;margin:8px 0 12px}
button{font:inherit;font-weight:600;padding:10px 18px;border-radius:9px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
@media (prefers-color-scheme:dark){button{color:#0B1620}}
button:disabled{opacity:.6;cursor:wait}
</style></head>

<main>
<h1>Connect to TaskDesk</h1>
<p>Enter the TaskDesk address your manager gave you. You only need to do this once.</p>
<form id="f">
  <label for="url">Server address</label>
  <input id="url" placeholder="http://192.168.1.222:3000" spellcheck="false" autocomplete="off">
  <div class="err" id="err"></div>
  <button id="go">Connect</button>
</form>
</main>
<script>
const url=document.getElementById('url'), err=document.getElementById('err'), go=document.getElementById('go');
window.td.getConfig().then(c=>{ url.value=c.server||''; url.focus(); url.select(); });
document.getElementById('f').onsubmit=async e=>{
  e.preventDefault(); err.textContent=''; go.disabled=true; go.textContent='Connecting…';
  let v=url.value.trim(); if(v && !/^https?:\/\//i.test(v)) v='http://'+v;
  const r=await window.td.testServer(v);
  if(r.ok){ await window.td.saveServer(v); }
  else { err.textContent=r.error; go.disabled=false; go.textContent='Connect'; }
};
</script>
</body></html>
