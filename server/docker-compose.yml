name: taskdesk
services:
  taskdesk:
    build: .
    container_name: taskdesk
    restart: unless-stopped
    env_file:
      - .env   # ADMIN_*, SMTP_*, APP_URL (copy .env.example; never commit .env)
    ports:
      - "3000:3000"
    environment:
      TZ: Asia/Kolkata
      # Set to "true" once the site is served over HTTPS
      COOKIE_SECURE: "false"
    volumes:
      - ./data:/app/data
      - ./updates:/app/updates
