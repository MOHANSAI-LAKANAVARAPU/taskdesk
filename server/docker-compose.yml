name: taskdesk
services:
  taskdesk:
    build: .
    container_name: taskdesk
    restart: unless-stopped
    env_file:
      - .env   # ADMIN_NAME, ADMIN_EMAIL, ADMIN_PASSWORD (copy .env.example)
    ports:
      - "3000:3000"
    environment:
      TZ: Asia/Kolkata
      # Set to "true" once the site is served over HTTPS
      COOKIE_SECURE: "false"
    volumes:
      - ./data:/app/data
      - ./updates:/app/updates
